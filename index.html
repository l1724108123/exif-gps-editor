
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>地图选点 EXIF 修改器</title>
    <meta name="theme-color" content="#3b82f6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/piexifjs@1.0.6/piexif.js"></script>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; background-color: #f3f4f6; touch-action: manipulation; }
        .map-container { width: 100%; height: 300px; border-radius: 0.5rem; overflow: hidden; position: relative; z-index: 1; background: #e5e7eb; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #3b82f6; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        .search-results-wrap { position: relative; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-4 px-4">
    <header class="text-center mb-4 max-w-3xl">
        <h1 class="text-2xl font-bold text-gray-800 mb-1"><i class="fa-solid fa-map-location-dot text-blue-600 mr-2"></i>地图选点 EXIF 修改器</h1>
        <p class="text-gray-500 text-xs">PWA 版本 · 离线可用 · 本地处理</p>
    </header>

    <main class="w-full max-w-6xl bg-white rounded-xl shadow-lg overflow-hidden flex flex-col lg:flex-row">
        <!-- Left: Image -->
        <div class="lg:w-1/2 p-4 border-b lg:border-b-0 lg:border-r border-gray-200 flex flex-col">
            <div id="uploadArea" class="flex-1 flex flex-col justify-center items-center border-2 border-dashed border-gray-300 rounded-lg bg-gray-50 hover:bg-blue-50 transition cursor-pointer min-h-[250px]">
                <i class="fa-solid fa-cloud-arrow-up text-4xl text-gray-400 mb-3"></i>
                <p class="text-gray-700 font-medium">点击上传 JPG 图片</p>
                <input type="file" id="fileInput" accept="image/jpeg,image/jpg" class="hidden">
            </div>
            <div id="previewArea" class="hidden flex-1 flex flex-col relative">
                <div class="relative flex-1 bg-gray-100 rounded-lg overflow-hidden flex items-center justify-center">
                    <img id="imagePreview" src="" alt="预览图" class="max-w-full max-h-[400px] object-contain">
                    <button id="changeImageBtn" class="absolute top-2 right-2 bg-white/90 text-gray-700 px-3 py-1 rounded shadow text-sm">换图</button>
                </div>
                <div class="mt-2 flex justify-between items-center text-sm text-gray-500 bg-gray-50 p-2 rounded">
                    <span id="fileNameDisplay" class="truncate max-w-[150px]">filename.jpg</span>
                    <span id="gpsStatus" class="text-xs px-2 py-0.5 rounded bg-gray-200">无GPS</span>
                </div>
            </div>
        </div>

        <!-- Right: Map & Controls -->
        <div class="lg:w-1/2 p-4 flex flex-col bg-white">
            <div class="mb-4">
                <div class="flex justify-between items-center mb-2">
                    <h3 class="font-bold text-gray-800 text-sm"><i class="fa-solid fa-map-pin text-red-500 mr-1"></i>地图选点</h3>
                    <button id="locateCurrentBtn" class="text-xs bg-blue-100 text-blue-600 px-2 py-1 rounded">
                        <i class="fa-solid fa-location-crosshairs mr-1"></i> 定位当前位置
                    </button>
                </div>
                <div class="search-results-wrap relative mb-2">
                    <input type="text" id="searchInput" placeholder="搜索地点..." class="w-full pl-9 pr-16 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-gray-400 text-xs"></i>
                    <button id="searchBtn" class="absolute right-2 top-1.5 bg-blue-100 text-blue-600 px-2 py-0.5 rounded text-xs">搜索</button>
                    <div id="searchResults" class="hidden z-50 bg-white border border-gray-200 shadow-lg rounded-lg w-full max-h-40 overflow-y-auto mt-1"></div>
                </div>
                <div id="mapContainer" class="map-container flex items-center justify-center text-gray-500">
                    <div id="mapLoading" class="text-center">
                        <div class="loader mx-auto mb-2"></div>
                        <p class="text-xs">地图加载中...</p>
                    </div>
                </div>
            </div>

            <div class="space-y-2 flex-1">
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">纬度</label>
                        <input type="number" step="any" id="latInput" class="w-full px-2 py-2 border border-gray-300 rounded-lg text-sm" placeholder="39.9042">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">经度</label>
                        <input type="number" step="any" id="lngInput" class="w-full px-2 py-2 border border-gray-300 rounded-lg text-sm" placeholder="116.4074">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">地址</label>
                    <input type="text" id="addressInput" readonly class="w-full px-2 py-2 bg-gray-50 border border-gray-200 rounded-lg text-gray-500 text-xs">
                </div>
            </div>

            <div class="mt-4 pt-2 border-t border-gray-100">
                <button id="saveBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-md transition-all active:scale-95">
                    <i class="fa-solid fa-download mr-2"></i> 保存并分享/下载
                </button>
            </div>
        </div>
    </main>

    <script src="https://webapi.amap.com/loader.js"></script>
    <script>
        const AMAP_KEY = '6155e5cc66ddfe4442a31f1478f30d24';
        const AMAP_SECURITY_CODE = '4ccd4667cc172341d650b1d721018619';
        window._AMapSecurityConfig = { securityJsCode: AMAP_SECURITY_CODE };

        const fileInput = document.getElementById('fileInput');
        const uploadArea = document.getElementById('uploadArea');
        const previewArea = document.getElementById('previewArea');
        const imagePreview = document.getElementById('imagePreview');
        const mapContainer = document.getElementById('mapContainer');
        const mapLoading = document.getElementById('mapLoading');
        
        let mapInstance = null, markerInstance = null, currentFileData = null, currentExifObj = null, isCurrentFileJpeg = false;

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('SW registered:', reg))
                .catch(err => console.log('SW failed:', err));
        }

        async function initMap() {
            try {
                const AMap = await AMapLoader.load({ key: AMAP_KEY, version: '2.0', plugins: ['AMap.Geocoder', 'AMap.PlaceSearch', 'AMap.Geolocation'] });
                mapLoading.style.display = 'none';
                mapInstance = new AMap.Map(mapContainer, { zoom: 11, center: [116.397428, 39.90923], viewMode: '2D' });
                mapInstance.on('click', (e) => updateLocation(e.lnglat.getLng(), e.lnglat.getLat()));
                setupSearch(AMap);
                setupGeolocation(AMap);
            } catch (e) {
                mapLoading.innerHTML = `<p class="text-red-500 text-xs">地图加载失败<br>请检查网络或密钥</p>`;
            }
        }

        function setupGeolocation(AMap) {
            const geolocation = new AMap.Geolocation({ enableHighAccuracy: true, timeout: 10000, zoomToAccuracy: true });
            document.getElementById('locateCurrentBtn').addEventListener('click', () => {
                geolocation.getCurrentPosition((status, result) => {
                    if (status === 'complete') {
                        updateLocation(result.position.lng, result.position.lat, result.formattedAddress);
                    } else {
                        alert('定位失败，请检查位置权限');
                    }
                });
            });
        }

        function setupSearch(AMap) {
            const placeSearch = new AMap.PlaceSearch({ pageSize: 5, city: "全国" });
            const searchResultsDom = document.getElementById('searchResults');
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.search-results-wrap')) searchResultsDom.classList.add('hidden');
            });
            document.getElementById('searchBtn').addEventListener('click', () => {
                const kw = document.getElementById('searchInput').value.trim();
                if(!kw) return;
                placeSearch.search(kw, (status, result) => {
                    if (status === 'complete' && result.info === 'OK') {
                        searchResultsDom.innerHTML = '';
                        result.poiList.pois.forEach(poi => {
                            const item = document.createElement('div');
                            item.className = 'p-2 hover:bg-blue-50 cursor-pointer border-b text-sm last:border-b-0';
                            item.innerText = poi.name + ' ' + poi.address;
                            item.onclick = () => {
                                updateLocation(poi.location.lng, poi.location.lat, poi.address);
                                searchResultsDom.classList.add('hidden');
                            };
                            searchResultsDom.appendChild(item);
                        });
                        searchResultsDom.classList.remove('hidden');
                    }
                });
            });
        }

        function updateLocation(lng, lat, addr) {
            document.getElementById('latInput').value = lat.toFixed(6);
            document.getElementById('lngInput').value = lng.toFixed(6);
            if(markerInstance) markerInstance.setMap(null);
            markerInstance = new AMap.Marker({ position: [lng, lat], map: mapInstance });
            mapInstance.setCenter([lng, lat]);
            if(addr) {
                document.getElementById('addressInput').value = addr;
            } else {
                new AMap.Geocoder().getAddress([lng, lat], (s, r) => {
                    if(s==='complete') document.getElementById('addressInput').value = r.regeocode.formattedAddress;
                });
            }
        }

        function isJpegFile(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                const blob = file.slice(0, 4);
                reader.onload = (e) => {
                    const arr = new Uint8Array(e.target.result);
                    resolve(arr[0] === 0xFF && arr[1] === 0xD8);
                };
                reader.readAsArrayBuffer(blob);
            });
        }

        uploadArea.addEventListener('click', () => fileInput.click());
        document.getElementById('changeImageBtn').addEventListener('click', () => fileInput.click());
        
        fileInput.addEventListener('change', async (e) => {
            if (e.target.files.length) {
                const file = e.target.files[0];
                const validJpeg = await isJpegFile(file);
                if (!validJpeg) { alert('仅支持标准 JPG 格式'); fileInput.value = ''; return; }
                isCurrentFileJpeg = true;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    currentFileData = ev.target.result;
                    imagePreview.src = currentFileData;
                    document.getElementById('fileNameDisplay').innerText = file.name;
                    uploadArea.classList.add('hidden');
                    previewArea.classList.remove('hidden');
                    try {
                        currentExifObj = piexif.load(currentFileData);
                        document.getElementById('gpsStatus').innerText = currentExifObj.GPS?.[piexif.GPSIFD.GPSLatitude] ? "已有GPS" : "无GPS";
                        document.getElementById('gpsStatus').className = currentExifObj.GPS?.[piexif.GPSIFD.GPSLatitude] ? "text-xs px-2 py-0.5 rounded bg-green-100 text-green-600" : "text-xs px-2 py-0.5 rounded bg-gray-200 text-gray-600";
                    } catch(err) { currentExifObj = {"0th":{}, "Exif":{}, "GPS":{}, "1st":{}}; }
                };
                reader.readAsDataURL(file);
            }
        });

        document.getElementById('saveBtn').addEventListener('click', async () => {
            if (!currentFileData || !isCurrentFileJpeg) { alert('请先上传有效的 JPG 图片'); return; }
            const lat = parseFloat(document.getElementById('latInput').value);
            const lng = parseFloat(document.getElementById('lngInput').value);
            if (isNaN(lat) || isNaN(lng)) { alert('请先在地图上选点'); return; }
            
            try {
                if (!currentExifObj) currentExifObj = {"0th":{}, "Exif":{}, "GPS":{}, "1st":{}};
                if (!currentExifObj.GPS) currentExifObj.GPS = {};
                
                const absLat = Math.abs(lat), absLng = Math.abs(lng);
                const dLat = Math.floor(absLat), mLat = Math.floor((absLat - dLat) * 60), sLat = ((absLat - dLat) * 60 - mLat) * 60;
                const dLng = Math.floor(absLng), mLng = Math.floor((absLng - dLng) * 60), sLng = ((absLng - dLng) * 60 - mLng) * 60;
                
                currentExifObj.GPS[piexif.GPSIFD.GPSLatitudeRef] = lat >= 0 ? 'N' : 'S';
                currentExifObj.GPS[piexif.GPSIFD.GPSLatitude] = [[dLat, 1], [mLat, 1], [Math.round(sLat * 10000), 10000]];
                currentExifObj.GPS[piexif.GPSIFD.GPSLongitudeRef] = lng >= 0 ? 'E' : 'W';
                currentExifObj.GPS[piexif.GPSIFD.GPSLongitude] = [[dLng, 1], [mLng, 1], [Math.round(sLng * 10000), 10000]];
                
                const exifBytes = piexif.dump(currentExifObj);
                const newData = piexif.insert(exifBytes, currentFileData);
                
                // 优化方案：转换为 Blob 并使用 Share API
                const res = await fetch(newData);
                const blob = await res.blob();
                const fileName = "geo_" + document.getElementById('fileNameDisplay').innerText;
                const file = new File([blob], fileName, { type: "image/jpeg" });

                // 优先使用 Web Share API (移动端体验最佳)
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    try {
                        await navigator.share({
                            files: [file],
                            title: 'EXIF修改后的图片',
                            text: '已修改GPS信息'
                        });
                        return;
                    } catch (shareError) {
                        console.log('分享取消或失败，转为传统下载', shareError);
                    }
                }

                // 兜底方案：传统下载
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = fileName;
                document.body.appendChild(link);
                link.click();
                setTimeout(() => {
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);
                }, 100);
                
            } catch (e) { 
                alert('保存出错: ' + e.message); 
            }
        });

        initMap();
    </script>
</body>
</html>
